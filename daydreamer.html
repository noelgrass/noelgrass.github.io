<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to the Dream | Noel Grass</title>
<link rel="icon" type="image/png" href="https://noelgrass.com/images/favicon.png">
<meta name="robots" content="noindex, nofollow"> <!-- Keeps this page private -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #000000;
    --gold: #C5A880;
    --gold-soft: #B9975C;
    --gold-pale: #E8D5B5;
    --offwhite: #EDEAE3;
    --muted: #9a958c;
    --rule: #2a2a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--offwhite);
    font-family: 'Playfair Display', Georgia, serif;
    line-height: 1.75;
    height: 100%;
    text-align: center;
  }

  a {
    color: var(--gold);
    text-decoration: none;
    transition: color 0.25s ease;
  }

  a:hover { color: #FCFCF7; }

  /* Center everything on the page */
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    max-width: 600px;
    margin: 0 auto;
  }

  .logo {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 1.5em;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 60px;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: 2.5em;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 30px;
    line-height: 1.2;
  }

  p {
    font-size: 1.1em;
    margin-bottom: 20px;
    color: var(--offwhite);
  }

  .highlight {
    font-style: italic;
    color: var(--gold-pale);
  }

  .signature {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.5em;
    color: var(--gold-pale);
    margin-top: 40px;
    margin-bottom: 60px;
  }

  .cta-link {
    display: inline-block;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.8em;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold-pale);
    border: 1px solid var(--rule);
    padding: 16px 32px;
    transition: all 0.3s ease;
  }

  .cta-link:hover {
    border-color: var(--gold);
    background: rgba(197, 168, 128, 0.05);
    color: #FCFCF7;
  }

</style>
</head>
<body>

  <div class="container">
    
    <div class="logo">Noel Grass</div>

    <h1>Welcome to<br>The Dream</h1>

    <p>You are officially a daydreamer.</p>
    
    <p>You've joined a quiet space where, <br>when you listen to a piece, <br>you can create your own world.</p>

    <div class="signature">— Noel</div>

    <!-- This links them straight to the music -->
    <a href="discography" class="cta-link">Explore the Catalogue</a>

  </div>

</body>
</html>
