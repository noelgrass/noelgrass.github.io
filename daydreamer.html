<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to the Dream | Noel Grass</title>
<link rel="icon" type="image/png" href="https://noelgrass.com/images/favicon.png">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #000000;
    --gold: #C5A880;
    --gold-soft: #B9975C;
    --gold-pale: #E8D5B5;
    --offwhite: #EDEAE3;
    --muted: #9a958c;
    --rule: #2a2a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--offwhite);
    font-family: 'Playfair Display', Georgia, serif;
    line-height: 1.85;
    height: 100%;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: var(--gold);
    text-decoration: none;
    transition: color 0.3s ease;
  }

  a:hover { color: #FCFCF7; }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 60px 24px;
    max-width: 680px;
    margin: 0 auto;
  }

  .logo {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400;
    font-size: 1.1em;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 80px;
    opacity: 0.9;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300;
    font-size: 3.2em;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 40px;
    line-height: 1.3;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--gold-soft);
    margin: 0 auto 40px;
    opacity: 0.5;
  }

  p {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.1em;
    margin-bottom: 24px;
    color: var(--offwhite);
    font-style: italic;
    max-width: 480px;
  }

  .name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.6em;
    font-weight: 500;
    color: var(--gold-pale);
    letter-spacing: 0.1em;
    margin-top: 50px;
    margin-bottom: 70px;
  }

  .cta-link {
    display: inline-block;
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 0.75em;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-pale);
    border: 1px solid var(--rule);
    padding: 18px 40px;
    transition: all 0.4s ease;
  }

  .cta-link:hover {
    border-color: var(--gold);
    background: rgba(197, 168, 128, 0.05);
    color: #FCFCF7;
    letter-spacing: 0.35em;
  }

  @media (max-width: 600px) {
    h1 { font-size: 2.2em; }
    .logo { margin-bottom: 60px; }
    .name { margin-bottom: 50px; }
  }
</style>
</head>
<body>

  <div class="container">
    
    <div class="logo">Noel Grass</div>

    <h1>Welcome<br>to the Dream</h1>
    
    <div class="divider"></div>

    <p>You are officially a daydreamer.</p>
    
    <p>You've joined a quiet space where, when you listen to a piece, you can create your own world.</p>

    <div class="name">Noel Grass</div>

    <a href="discography" class="cta-link">Explore the Catalogue</a>

  </div>

</body>
</html>
