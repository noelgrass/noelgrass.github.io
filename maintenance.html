<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Under Maintenance | Noel Grass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C5A880;
            --gold-soft: #B9975C;
            --gold-pale: #E8D5B5;
            --offwhite: #EDEAE3;
            --muted: #9a958c;
            --bg: #000000;
        }

        body { 
            background: var(--bg); 
            background-image: radial-gradient(circle at 50% 50%, rgba(197, 168, 128, 0.08) 0%, transparent 65%);
            color: var(--offwhite); 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 24px; 
            text-align: center; 
            overflow: hidden;
        }

        .box { 
            max-width: 460px; 
            width: 100%;
            border: 1px solid rgba(185, 151, 92, 0.3); 
            padding: 70px 40px; 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 50px rgba(197, 168, 128, 0.1); 
            position: relative;
            animation: elegantFadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes elegantFadeUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 { 
            font-family: 'Cormorant Garamond', serif; 
            background: linear-gradient(to right, var(--gold-pale), var(--gold), var(--gold-soft));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            font-size: 2.4em; 
            letter-spacing: 0.15em; 
            text-transform: uppercase; 
            margin-bottom: 24px; 
            font-weight: 600;
            line-height: 1.1;
        }

        .subhead { 
            font-family: 'Playfair Display', Georgia, serif; 
            font-style: italic; 
            font-size: 1.15em; 
            line-height: 1.8; 
            color: var(--muted); 
            margin: 0;
            letter-spacing: 0.02em;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: var(--gold-soft);
            margin: 30px auto;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Under Maintenance</h1>
        <div class="divider"></div>
        <p class="subhead">We are currently updating the system and making a few refinements. We will be back shortly.</p>
    </div>
</body>
</html>
