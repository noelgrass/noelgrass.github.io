<style>

  @keyframes fadeUp {

    from { opacity: 0; transform: scale(0.96); }

  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {

      animation-iteration-count: 1 !important;

  .topnav {

  .topnav a {

    font-weight: 400;
    font-size: 0.8em;
    letter-spacing: 0.2em;
    text-transform: uppercase;

    border-bottom: none;
    position: relative;

    content: '';
    position: absolute;
    left: 0;

    width: 0;
    height: 1px;
    background: var(--gold);
    transition: width 0.35s ease;
    pointer-events: none;

  .topnav li { position: relative; }

  .topnav li + li::before {
    content: '';
    position: absolute;
    left: -18px;
    top: 50%;
    transform: translateY(-50%);
    width: 1px;
    height: 14px;
    background: var(--gold-soft);
    opacity: 0.6;
  }

  /* ---------- ALBUM COVER (with spotlight) ---------- */
  .album-cover {
    display: inline-block;
    position: relative;
    max-width: 480px;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #1a1a1a;
    overflow: visible;
    margin: 0 auto 20px;
    animation: coverIn 1.4s ease-out both;
    animation-delay: 0.4s;
  }

  .album-cover .frame {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border: 1px solid #1f1f1f;
    transition: border-color 0.7s ease, box-shadow 0.7s ease, transform 0.6s ease;
  }

  /* Spotlight glow behind the album cover */
  .album-cover::before {
    content: '';
    position: absolute;
    inset: -80px;
    background: radial-gradient(
      circle at 50% 30%,
      rgba(197, 168, 128, 0.18) 0%,
      rgba(197, 168, 128, 0.05) 40%,
      transparent 70%
    );
    pointer-events: none;
    z-index: -1;
    opacity: 0;
    transition: opacity 0.9s ease;
  }

  .album-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.72) contrast(1.05);
    transition: filter 0.8s ease, transform 0.8s ease;
  }

  /* Hover state — album lights up */
  .album-cover:hover .frame {
    border-color: var(--gold-soft);
    box-shadow: 0 20px 60px rgba(197, 168, 128, 0.15);
    transform: translateY(-6px);
  }

  .album-cover:hover::before {
    opacity: 1;
  }

  .album-cover:hover img {
    filter: brightness(1) contrast(1);
    transform: scale(1.02);
  }

  .cta-heading {

    display: block;

  .icons.group-2 { animation-delay: 1.35s; }

  .icons a {

  .icons a:hover {

  .icons svg { width: 36px; height: 36px; fill: currentColor; }

  /* ---------- SIGNATURE ---------- */

  /* ---------- RESPONSIVE ---------- */

      transform: none;
    }
    .album-cover:hover .frame {
      transform: none;
    }
    .cta-heading { font-size: 1.1em; margin: 50px 0 20px; }
    .topnav { padding: 20px 14px; }
    .topnav a { font-size: 0.7em; letter-spacing: 0.15em; }
    .topnav ul { gap: 10px 22px; }
    .topnav li + li::before { left: -12px; height: 10px; }
    .icons { gap: 30px; }
    .icons svg { width: 32px; height: 32px; }
    .signature-logo { height: 55px; }
  }
</style>
