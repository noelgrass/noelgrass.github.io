<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="JuTCKvWQJUv0mCfM69TcrIja7bt--m6m6s7ME3gVoqg" />
<title>Noel Grass — Tour Dates</title>
<link rel="icon" type="image/png" href="https://noelgrass.com/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #050505;
    --surface: #0a0a0a;
    --gold: #C5A880;
    --gold-dim: #7a6b4f;
    --offwhite: #EDEAE3;
    --muted: #6b655c;
    --rule: #1a1a1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--offwhite); font-family: 'Playfair Display', Georgia, serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  
  /* Cinematic Background Texture */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(circle at 50% 30%, rgba(20,20,20,0.8) 0%, #000000 70%);
    pointer-events: none;
  }

  /* Navigation (Simplified for focus) */
  .topnav { position: sticky; top: 0; z-index: 100; padding: 24px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(5,5,5,0.8); backdrop-filter: blur(12px); }
  .wordmark { font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 0.7em; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold); text-decoration: none; }
  .menu-toggle { background: none; border: none; color: var(--offwhite); cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 0.7em; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; transition: opacity 0.3s; }
  .menu-toggle:hover { opacity: 1; }

  /* Hero Section - Dynamic Hierarchy */
  .hero-cinematic {
    min-height: 60vh; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; text-align: center; 
    padding: 80px 40px 60px; position: relative;
    transition: all 0.8s cubic-bezier(0.16,1,0.3,1);
  }

  .tour-label {
    font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 0.65em; 
    letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-dim); 
    margin-bottom: 24px; opacity: 0; transform: translateY(10px);
    animation: fadeUp 1s ease-out 0.2s forwards;
  }

  .tour-title-main {
    font-family: 'Cormorant Garamond', serif; font-weight: 300; 
    font-size: clamp(2.5rem, 7vw, 5.5rem); line-height: 1.1; 
    color: var(--offwhite); letter-spacing: 0.02em; margin-bottom: 30px;
    opacity: 0; transform: translateY(20px);
    animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
    text-shadow: 0 0 60px rgba(237,234,227,0.05);
  }

  .tour-divider {
    width: 40px; height: 1px; background: var(--gold-dim); margin: 0 auto;
    opacity: 0; animation: fadeIn 1s ease-out 0.8s forwards;
  }

  /* RY X Style List Layout */
  .tour-container { max-width: 850px; margin: 0 auto; padding: 40px 40px 120px; }
  
  .tour-list { display: flex; flex-direction: column; }
  
  .tour-date {
    display: grid; grid-template-columns: 140px 1fr auto; gap: 40px; 
    align-items: baseline; padding: 32px 0; border-bottom: 1px solid var(--rule);
    opacity: 0; transform: translateY(15px); transition: all 0.6s ease;
  }
  .tour-date.visible { opacity: 1; transform: translateY(0); }
  .tour-date:last-child { border-bottom: none; }

  .td-day {
    font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 0.7em; 
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold-dim);
  }

  .td-info { display: flex; flex-direction: column; gap: 6px; }
  .td-venue {
    font-family: 'Cormorant Garamond', serif; font-weight: 500; 
    font-size: 1.6em; color: var(--offwhite); transition: color 0.4s ease;
  }
  .tour-date:hover .td-venue { color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
  
  .td-location {
    font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 0.68em; 
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
  }

  /* Action Area */
  .td-action { display: flex; align-items: center; justify-content: flex-end; min-width: 140px; }
  
  .btn-ticket {
    font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 0.65em; 
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); 
    background: transparent; border: 1px solid rgba(197,168,128,0.3); 
    padding: 12px 28px; cursor: pointer; transition: all 0.35s ease;
  }
  .btn-ticket:hover {
    border-color: var(--gold); background: rgba(197,168,128,0.05); 
    box-shadow: 0 0 25px rgba(197,168,128,0.1); color: #fff;
  }

  .status-soldout {
    font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 0.65em; 
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); opacity: 0.5;
  }

  /* Footer Label (Small & Centered) */
  .footer-brand { text-align: center; padding: 60px 0 40px; }
  .footer-brand span {
    font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 0.6em; 
    letter-spacing: 0.45em; text-transform: uppercase; color: var(--gold-dim);
    display: inline-block; position: relative; padding-bottom: 10px;
  }
  .footer-brand span::after {
    content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 24px; height: 1px; background: var(--gold-dim); opacity: 0.4;
  }

  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { to { opacity: 1; } }

  @media (max-width: 700px) {
    .hero-cinematic { min-height: 50vh; padding: 60px 24px 40px; }
    .tour-container { padding: 20px 24px 80px; }
    .tour-date { grid-template-columns: 1fr; gap: 12px; padding: 28px 0; }
    .td-action { justify-content: flex-start; margin-top: 8px; }
    .btn-ticket, .status-soldout { padding: 10px 20px; }
  }
</style>
</head>
<body>

<header class="topnav">
  <a href="./" class="wordmark">Noel Grass</a>
  <button class="menu-toggle" id="menuToggle">Menu</button>
</header>

<div class="hero-cinematic" id="heroSection">
  <div class="tour-label" id="tourLabel">Tour Dates</div>
  <h1 class="tour-title-main" id="tourTitleMain"></h1>
  <div class="tour-divider" id="tourDivider"></div>
</div>

<div class="tour-container">
  <div class="tour-list" id="tourListMount"></div>
  
  <div class="footer-brand">
    <span>Noel Grass</span>
  </div>
</div>

<script>
  const API_URL = "https://master-brain.noelgrass.workers.dev/api/data?table=tour_dates&published=1";

  fetch(API_URL)
    .then(res => res.json())
    .then(data => renderCinematicTour(data))
    .catch(err => console.error("Tour load failed:", err));

  function renderCinematicTour(dates) {
    const mount = document.getElementById('tourListMount');
    const hero = document.getElementById('heroSection');
    const titleEl = document.getElementById('tourTitleMain');
    const labelEl = document.getElementById('tourLabel');
    const divider = document.getElementById('tourDivider');

    if (!dates || !dates.length) {
      mount.innerHTML = '<p style="text-align:center; color:var(--muted); padding:60px 0; font-style:italic;">Dates are being confirmed.</p>';
      return;
    }

    // Sort by date ascending
    const sorted = dates.sort((a,b) => (a.event_date||'').localeCompare(b.event_date||''));

    // 1. HANDLE TOUR TITLE VISIBILITY
    const firstDate = sorted[0];
    const hasTitle = firstDate.tour_title && firstDate.tour_title.trim() !== '';
    const isHidden = parseInt(firstDate.hide_title) === 1;

    if (isHidden || !hasTitle) {
      // Hide entire hero text block for ultra-minimalist look
      titleEl.style.display = 'none';
      labelEl.style.display = 'none';
      divider.style.display = 'none';
      hero.style.minHeight = '30vh'; // Reduce hero height when no title
    } else {
      titleEl.textContent = firstDate.tour_title;
    }

    // 2. RENDER LIST WITH NEW LOGIC
    mount.innerHTML = sorted.map(show => {
      const dateObj = new Date(show.event_date);
      const dayStr = dateObj.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }).toUpperCase();
      
      const isSoldOut = parseInt(show.sold_out) === 1;
      const hasTicket = show.ticket_url && show.ticket_url.trim() !== '';

      let actionHtml = '';
      if (isSoldOut) {
        actionHtml = '<span class="status-soldout">Sold Out</span>';
      } else if (hasTicket) {
        actionHtml = `<a href="${show.ticket_url}" target="_blank" rel="noopener" class="btn-ticket">Tickets</a>`;
      }

      return `
        <div class="tour-date">
          <div class="td-day">${dayStr}</div>
          <div class="td-info">
            <span class="td-venue">${show.venue}</span>
            <span class="td-location">${show.city}${show.country ? ', '+show.country : ''}</span>
          </div>
          <div class="td-action">${actionHtml}</div>
        </div>
      `;
    }).join('');

    // 3. INIT SCROLL ANIMATIONS
    initScrollReveal();
  }

  function initScrollReveal() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });

    document.querySelectorAll('.tour-date').forEach(el => observer.observe(el));
  }

  // Simple Menu Toggle Logic
  document.getElementById('menuToggle')?.addEventListener('click', () => {
    alert('Menu integration placeholder - connect to your existing nav system');
  });
</script>

</body>
</html>
