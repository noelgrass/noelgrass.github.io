<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noel Grass — Tour Dates</title>
<link rel="icon" type="image/png" href="https://noelgrass.com/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #030303; --surface: #0a0a0a; --gold: #C5A880; --gold-dim: #7a6b4f;
    --offwhite: #EDEAE3; --muted: #5c5750; --rule: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    background: var(--bg); color: var(--offwhite); font-family: 'Playfair Display', Georgia, serif; 
    -webkit-font-smoothing: antialiased; overflow-x: hidden; position: relative;
  }

  /* Cinematic Textures */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 9998; pointer-events: none;
    background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.95) 100%);
  }

  /* Navigation */
  .topnav { position: sticky; top: 0; z-index: 100; padding: 30px 50px; display: flex; justify-content: center; align-items: center; background: rgba(3,3,3,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
  .wordmark { font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 0.75em; letter-spacing: 0.6em; text-transform: uppercase; color: var(--gold); text-decoration: none; transition: text-shadow 0.4s ease; }
  .wordmark:hover { text-shadow: 0 0 20px rgba(197,168,128,0.5); }

  /* Hero Section */
  .hero-cinematic {
    min-height: 75vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
    text-align: center; padding: 100px 40px 80px; position: relative; transition: all 1s cubic-bezier(0.16,1,0.3,1);
  }
  .tour-label {
    font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 0.7em; letter-spacing: 0.6em; 
    text-transform: uppercase; color: var(--gold-dim); margin-bottom: 30px; opacity: 0; transform: translateY(15px);
    animation: fadeUp 1.2s ease-out 0.2s forwards;
  }
  .tour-title-main {
    font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(3.5rem, 10vw, 9rem); 
    line-height: 1.0; color: var(--offwhite); letter-spacing: 0.01em; margin-bottom: 40px;
    opacity: 0; transform: translateY(30px); animation: fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) 0.4s forwards;
    text-shadow: 0 0 100px rgba(237,234,227,0.1);
  }
  .tour-divider {
    width: 120px; height: 1px; background: var(--gold-dim); margin: 0 auto; opacity: 0; animation: fadeIn 1.5s ease-out 0.8s forwards;
  }

  /* Tour List & Spotlight Effect */
  .tour-container { max-width: 1200px; margin: 0 auto; padding: 20px 40px 160px; position: relative; z-index: 1; }
  .tour-list { display: flex; flex-direction: column; position: relative; }
  
  .tour-date {
    display: grid; grid-template-columns: 200px 1fr auto; gap: 60px; align-items: baseline; 
    padding: 50px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); opacity: 0; transform: translateY(20px); 
    transition: all 0.6s cubic-bezier(0.16,1,0.3,1); position: relative; z-index: 2;
  }
  .tour-date.visible { opacity: 1; transform: translateY(0); }
  .tour-date:last-child { border-bottom: none; }

  /* Spotlight Logic */
  .tour-list:hover .tour-date:not(:hover) { opacity: 0.2; filter: grayscale(1) blur(2px); }
  .tour-date:hover { 
    opacity: 1 !important; filter: none !important; transform: translateX(12px); 
    background: radial-gradient(circle at 20% 50%, rgba(197,168,128,0.08) 0%, transparent 70%);
    border-bottom-color: rgba(197,168,128,0.3);
  }

  .td-day { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 0.8em; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold-dim); transition: color 0.4s ease; }
  .tour-date:hover .td-day { color: var(--gold); }
  .td-info { display: flex; flex-direction: column; gap: 10px; }
  .td-venue { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 2.4em; color: var(--offwhite); transition: all 0.4s ease; }
  .tour-date:hover .td-venue { color: #fff; text-shadow: 0 0 40px rgba(255,255,255,0.2); }
  .td-location { font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 0.75em; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); }

  /* Actions */
  .td-action { display: flex; align-items: center; justify-content: flex-end; min-width: 180px; }
  .btn-ticket {
    font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 0.75em; letter-spacing: 0.25em; 
    text-transform: uppercase; color: var(--gold); background: transparent; border: 1px solid rgba(197,168,128,0.4); 
    padding: 18px 40px; cursor: pointer; transition: all 0.4s ease; position: relative; overflow: hidden;
  }
  .tour-date:hover .btn-ticket {
    border-color: var(--gold); background: rgba(197,168,128,0.15); box-shadow: 0 0 40px rgba(197,168,128,0.2); color: #fff;
  }
  .status-soldout {
    font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 0.75em; letter-spacing: 0.25em; 
    text-transform: uppercase; color: var(--muted); opacity: 0.6;
  }

  /* Footer Brand */
  .footer-brand { text-align: center; padding: 100px 0 60px; }
  .footer-brand span {
    font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 0.65em; letter-spacing: 0.6em; 
    text-transform: uppercase; color: var(--gold-dim); display: inline-block; position: relative; padding-bottom: 15px;
  }
  .footer-brand span::after {
    content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 40px; height: 1px; background: var(--gold-dim); opacity: 0.4;
  }

  /* Hiatus Screen Styling */
  .hiatus-content { text-align: center; padding: 100px 40px; animation: fadeUp 1.5s cubic-bezier(0.16,1,0.3,1) both; }
  .hiatus-diamond { display: inline-block; width: 10px; height: 10px; background: var(--gold); transform: rotate(45deg); margin-bottom: 40px; opacity: 0.8; animation: pulse 3s infinite alternate; }
  .hiatus-label { font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 0.85em; letter-spacing: 0.6em; text-transform: uppercase; color: var(--gold-pale); display: block; margin-bottom: 30px; }
  .hiatus-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 300; color: var(--offwhite); margin-bottom: 20px; letter-spacing: 0.02em; }
  .hiatus-text { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-size: 1.3em; line-height: 1.8; color: var(--muted); max-width: 600px; margin: 0 auto 50px; }
  .hiatus-btn { 
    display: inline-block; font-family: 'Montserrat', sans-serif; font-size: 0.75em; letter-spacing: 0.3em; 
    text-transform: uppercase; color: var(--gold); text-decoration: none; padding: 18px 40px; 
    border: 1px solid rgba(197,168,128,0.4); transition: all 0.4s ease;
  }
  .hiatus-btn:hover { border-color: var(--gold); background: rgba(197,168,128,0.1); box-shadow: 0 0 30px rgba(197,168,128,0.2); color: #fff; }

  /* Admin Panel Styles */
  .admin-wrapper { max-width: 900px; margin: 40px auto; padding: 0 40px; display: none; }
  .admin-section { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 24px; margin-bottom: 30px; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--rule); padding-bottom: 15px; }
  .admin-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.4em; color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase; }
  .btn-admin { font-family: 'Montserrat', sans-serif; font-size: 0.65em; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 20px; border-radius: 2px; cursor: pointer; border: 1px solid var(--gold); background: transparent; color: var(--gold); transition: all 0.3s; }
  .btn-admin:hover { background: rgba(197,168,128,0.1); box-shadow: 0 0 15px rgba(197,168,128,0.15); }
  .badge { font-size: 0.65em; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 2px; display: inline-block; }
  .badge-active { background: rgba(74,124,89,0.15); color: #6da37d; border: 1px solid rgba(74,124,89,0.3); }
  .badge-inactive { background: rgba(140,74,74,0.15); color: #b36b6b; border: 1px solid rgba(140,74,74,0.3); }
  
  .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .data-table th { text-align: left; padding: 12px 16px; font-size: 0.6em; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); }
  .data-table td { padding: 16px; border-bottom: 1px solid var(--rule); vertical-align: middle; font-size: 0.9em; }
  .data-table tr:hover td { background: rgba(197,168,128,0.03); }
  
  .form-group { margin-bottom: 16px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { display: block; font-size: 0.6em; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  input[type="text"], input[type="date"], input[type="url"], input[type="number"] {
    width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--rule); color: var(--offwhite);
    padding: 10px 12px; font-family: 'Montserrat', sans-serif; font-size: 0.85em; border-radius: 2px;
  }
  input:focus { outline: none; border-color: var(--gold-dim); }
  .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .checkbox-label input { display: none; }
  .checkmark { width: 16px; height: 16px; border: 1px solid var(--rule); border-radius: 2px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); transition: all 0.2s; }
  .checkbox-label input:checked + .checkmark { background: var(--gold); border-color: var(--gold); }
  .checkbox-label input:checked + .checkmark::after { content: ''; width: 3px; height: 7px; border: solid var(--bg); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); margin-bottom: 2px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-content { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; width: 100%; max-width: 500px; padding: 30px; transform: translateY(10px); transition: transform 0.3s; }
  .modal-overlay.active .modal-content { transform: translateY(0); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.3em; color: var(--gold); }
  .close-btn { background: none; border: none; color: var(--muted); font-size: 1.5em; cursor: pointer; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--rule); }

  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes pulse { from { opacity: 0.4; box-shadow: 0 0 10px transparent; } to { opacity: 1; box-shadow: 0 0 20px var(--gold); } }
  
  @media (max-width: 768px) {
    .hero-cinematic { min-height: 60vh; padding: 80px 24px 40px; }
    .tour-container { padding: 20px 24px 80px; }
    .tour-date { grid-template-columns: 1fr; gap: 20px; padding: 40px 20px; }
    .td-action { justify-content: flex-start; margin-top: 10px; }
    .tour-date:hover { transform: translateX(0); }
    .admin-wrapper { padding: 0 20px; }
    .tour-divider { width: 60px; }
  }
</style>
</head>
<body>

<!-- PUBLIC VIEW -->
<div id="publicView">
  <header class="topnav">
    <a href="./" class="wordmark">Noel Grass</a>
  </header>

  <div class="hero-cinematic" id="heroSection">
    <div class="tour-label" id="tourLabel">Tour Dates</div>
    <h1 class="tour-title-main" id="tourTitleMain"></h1>
    <div class="tour-divider" id="tourDivider"></div>
  </div>

  <div class="tour-container">
    <div class="tour-list" id="tourListMount"></div>
    <div class="footer-brand"><span>Noel Grass</span></div>
  </div>
</div>

<!-- ADMIN VIEW -->
<div class="admin-wrapper" id="adminView">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
    <h1 style="font-family:'Cormorant Garamond',serif; font-size:2em; color:var(--gold); letter-spacing:0.1em;">Tour Management</h1>
    <button class="btn-admin" onclick="toggleAdmin()">Back to Site</button>
  </div>

  <!-- PAGE STATUS CONTROL -->
  <div class="admin-section" style="border-color: var(--gold-dim);">
    <div class="admin-header" style="border-bottom:none; margin-bottom:15px;">
      <h2 style="font-size:1.1em;">Page Status</h2>
      <span id="pageStatusBadge" class="badge badge-active">Active</span>
    </div>
    <label class="checkbox-label" style="margin-bottom:10px;">
      <input type="checkbox" id="tourPageActive" checked onchange="toggleTourPageStatus()">
      <span class="checkmark"></span>
      <span style="font-family:'Montserrat',sans-serif; font-size:0.85em; color:var(--offwhite);">Show Tour Dates Publicly</span>
    </label>
    <p style="font-size:0.75em; color:var(--muted); line-height:1.5;">When unchecked, public page displays cinematic "Tour Hiatus" message regardless of database dates.</p>
  </div>

  <!-- DATES TABLE -->
  <div class="admin-section">
    <div class="admin-header">
      <h2>Tour Dates</h2>
      <button class="btn-admin" onclick="openModal()">+ Add Date</button>
    </div>
    <table class="data-table">
      <thead><tr><th>Date</th><th>Venue</th><th>City</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="adminTableBody"><tr><td colspan="5" style="text-align:center; padding:30px; color:var(--muted);">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="tourModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Add Tour Date</h3>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    <form id="tourForm" onsubmit="saveTourDate(event)">
      <input type="hidden" id="td_id">
      <div class="form-group"><label>Tour Title</label><input type="text" id="td_tour_title" placeholder="e.g. The Stillness Tour"></div>
      <div class="form-group"><label>Event Date *</label><input type="date" id="td_event_date" required></div>
      <div class="form-row">
        <div class="form-group"><label>Venue *</label><input type="text" id="td_venue" required></div>
        <div class="form-group"><label>City / Country *</label><input type="text" id="td_city" required></div>
      </div>
      <div class="form-group"><label>Ticket Link</label><input type="url" id="td_ticket_url" placeholder="https://..."></div>
      <div class="form-row">
        <div class="form-group"><label>Sort Order</label><input type="number" id="td_sort_order" value="0"></div>
        <div class="form-group" style="display:flex; align-items:flex-end; padding-bottom:4px;">
          <label class="checkbox-label"><input type="checkbox" id="td_published" checked><span class="checkmark"></span>Publish</label>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group" style="display:flex; align-items:flex-end; padding-bottom:4px;">
          <label class="checkbox-label"><input type="checkbox" id="td_hide_title"><span class="checkmark"></span>Hide Title</label>
        </div>
        <div class="form-group" style="display:flex; align-items:flex-end; padding-bottom:4px;">
          <label class="checkbox-label"><input type="checkbox" id="td_sold_out"><span class="checkmark"></span>Sold Out</label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-admin" style="border-color:var(--rule); color:var(--muted);" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-admin">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
  const READ_API = "https://master-brain.noelgrass.workers.dev/api/data";
  const ADMIN_API = "https://admin-api.noelgrass.workers.dev";
  
  const token = localStorage.getItem('adminToken');
  let isAdmin = false;
  let allDatesCache = [];

  async function initPublic() {
    try {
      const statusRes = await fetch(`${READ_API}?table=settings&key=tour_page_active&t=${Date.now()}`);
      const statusData = await statusRes.json();
      
      const setting = Array.isArray(statusData) ? statusData[0] : statusData;
      const isActive = setting && setting.value === '1';

      if (!isActive) {
        renderHiatus();
        return;
      }

      const datesRes = await fetch(`${READ_API}?table=tour_dates&published=1&t=${Date.now()}`);
      const dates = await datesRes.json();
      
      if (!dates || !dates.length) { renderHiatus(); return; }
      
      const sorted = dates.sort((a,b) => (a.event_date||'').localeCompare(b.event_date||''));
      renderHero(sorted[0]);
      renderList(sorted);
    } catch (err) { console.error("Init failed:", err); }
  }

  function renderHiatus() {
    document.getElementById('tourLabel').style.display = 'none';
    document.getElementById('tourTitleMain').style.display = 'none';
    document.getElementById('tourDivider').style.display = 'none';
    document.getElementById('heroSection').style.minHeight = '40vh';
    
    document.getElementById('tourListMount').innerHTML = `
      <div class="hiatus-content">
        <span class="hiatus-diamond"></span>
        <span class="hiatus-label">Tour Hiatus</span>
        <h1 class="hiatus-title">Currently composing new works.</h1>
        <p class="hiatus-text">Live performances will resume shortly.</p>
        <a href="join" class="hiatus-btn">Join mailing list for first access →</a>
      </div>`;
  }

  function renderHero(firstDate) {
    const titleEl = document.getElementById('tourTitleMain');
    const labelEl = document.getElementById('tourLabel');
    const divider = document.getElementById('tourDivider');
    const hero = document.getElementById('heroSection');
    
    if (parseInt(firstDate.hide_title) === 1 || !firstDate.tour_title) {
      titleEl.style.display = 'none'; labelEl.style.display = 'none'; divider.style.display = 'none';
      hero.style.minHeight = '40vh';
    } else {
      titleEl.style.display = 'block'; labelEl.style.display = 'block'; divider.style.display = 'block';
      titleEl.textContent = firstDate.tour_title;
    }
  }

  function renderList(dates) {
    const mount = document.getElementById('tourListMount');
    mount.innerHTML = dates.map(show => {
      const d = new Date(show.event_date).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}).toUpperCase();
      const soldOut = parseInt(show.sold_out) === 1;
      const hasTicket = show.ticket_url && show.ticket_url.trim() !== '';
      
      let action = '';
      if (soldOut) action = '<span class="status-soldout">Sold Out</span>';
      else if (hasTicket) action = `<a href="${show.ticket_url}" target="_blank" class="btn-ticket">Tickets</a>`;

      return `<div class="tour-date">
        <div class="td-day">${d}</div>
        <div class="td-info"><span class="td-venue">${show.venue}</span><span class="td-location">${show.city}${show.country?', '+show.country:''}</span></div>
        <div class="td-action">${action}</div>
      </div>`;
    }).join('');

    const obs = new IntersectionObserver(e => e.forEach(en => { if(en.isIntersecting){ en.target.classList.add('visible'); obs.unobserve(en.target); } }), {threshold:0.1});
    document.querySelectorAll('.tour-date').forEach(el => obs.observe(el));
  }

  // --- ADMIN LOGIC ---
  function toggleAdmin() {
    isAdmin = !isAdmin;
    document.getElementById('publicView').style.display = isAdmin ? 'none' : 'block';
    document.getElementById('adminView').style.display = isAdmin ? 'block' : 'none';
    if(isAdmin) loadAdminData();
  }

  async function loadAdminData() {
    try {
      const s = await fetch(`${READ_API}?table=settings&key=tour_page_active&t=${Date.now()}`);
      const sd = await s.json();
      const setting = Array.isArray(sd) ? sd[0] : sd;
      const active = setting && setting.value === '1';
      
      document.getElementById('tourPageActive').checked = active;
      updateStatusBadge(active);
    } catch(e){ console.error(e); }

    try {
      const r = await fetch(`${ADMIN_API}/list?table=tour_dates`, { headers: { 'Authorization': `Bearer ${token}` } });
      allDatesCache = await r.json();
      const tbody = document.getElementById('adminTableBody');
      
      if(!allDatesCache.length) { 
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--muted)">No dates found.</td></tr>'; 
        return; 
      }
      
      tbody.innerHTML = allDatesCache.sort((a,b)=>(b.event_date||'').localeCompare(a.event_date||'')).map(item => {
        const pub = parseInt(item.published)===1;
        const so = parseInt(item.sold_out)===1;
        const dt = item.event_date ? new Date(item.event_date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—';
        let badges = `<span class="badge ${pub?'badge-active':'badge-inactive'}">${pub?'Published':'Draft'}</span>`;
        if(so) badges += ` <span class="badge badge-inactive">Sold Out</span>`;
        
        return `<tr><td style="font-family:'Cormorant Garamond',serif;font-size:1.1em">${dt}</td><td>${item.venue||'—'}</td><td>${item.city||'—'}</td><td>${badges}</td><td><button class="btn-admin" style="padding:6px 14px;font-size:0.6em" onclick="openModal('${item.id}')">Edit</button></td></tr>`;
      }).join('');
    } catch(e){ console.error(e); }
  }

  async function toggleTourPageStatus() {
    const val = document.getElementById('tourPageActive').checked ? '1' : '0';
    updateStatusBadge(val === '1');
    
    const fd = new FormData();
    fd.append('value', val);

    try {
      const res = await fetch(`${ADMIN_API}/toggle-page-status`, { 
        method:'POST', 
        headers:{'Authorization': `Bearer ${token}`}, 
        body: fd 
      });
      
      if(!res.ok) throw new Error("Rejected");
      initPublic();
      
    } catch(e){ 
      alert("Failed to update status."); 
      const currentState = document.getElementById('tourPageActive').checked;
      document.getElementById('tourPageActive').checked = !currentState; 
      updateStatusBadge(!currentState);
    }
  }

  function updateStatusBadge(active) {
    const b = document.getElementById('pageStatusBadge');
    b.textContent = active ? 'Active' : 'Hiatus Mode';
    b.className = `badge ${active?'badge-active':'badge-inactive'}`;
  }

  function openModal(id=null) {
    document.getElementById('tourForm').reset();
    document.getElementById('td_id').value = '';
    document.getElementById('td_published').checked = true;
    document.getElementById('modalTitle').textContent = 'Add Tour Date';
    
    if(id) {
      const item = allDatesCache.find(i => i.id === id);
      if(item) {
        document.getElementById('td_id').value = item.id;
        document.getElementById('td_tour_title').value = item.tour_title || '';
        document.getElementById('td_event_date').value = item.event_date || '';
        document.getElementById('td_venue').value = item.venue || '';
        document.getElementById('td_city').value = item.city || '';
        document.getElementById('td_ticket_url').value = item.ticket_url || '';
        document.getElementById('td_sort_order').value = item.sort_order || 0;
        document.getElementById('td_published').checked = parseInt(item.published) === 1;
        document.getElementById('td_hide_title').checked = parseInt(item.hide_title) === 1;
        document.getElementById('td_sold_out').checked = parseInt(item.sold_out) === 1;
        document.getElementById('modalTitle').textContent = 'Edit Tour Date';
      }
    }
    document.getElementById('tourModal').classList.add('active');
  }
  function closeModal() { document.getElementById('tourModal').classList.remove('active'); }
  
  async function saveTourDate(e) {
    e.preventDefault();
    
    const fd = new FormData();
    fd.append('type', 'tour');
    fd.append('original_id', document.getElementById('td_id').value);
    fd.append('id', document.getElementById('td_id').value); 
    fd.append('tour_title', document.getElementById('td_tour_title').value.trim());
    fd.append('event_date', document.getElementById('td_event_date').value);
    fd.append('venue', document.getElementById('td_venue').value.trim());
    fd.append('city', document.getElementById('td_city').value.trim());
    fd.append('ticket_url', document.getElementById('td_ticket_url').value.trim());
    fd.append('sort_order', document.getElementById('td_sort_order').value);
    fd.append('published', document.getElementById('td_published').checked ? '1' : '0');
    fd.append('hide_title', document.getElementById('td_hide_title').checked ? '1' : '0');
    fd.append('sold_out', document.getElementById('td_sold_out').checked ? '1' : '0');

    try {
      const res = await fetch(ADMIN_API, { 
        method: 'POST', 
        headers: { 'Authorization': `Bearer ${token}` }, 
        body: fd 
      });
      
      if(res.ok) {
        closeModal(); 
        loadAdminData();
        initPublic();
      } else {
        alert("Failed to save date.");
      }
    } catch(err) { alert("Save error: "+err.message); }
  }

  document.addEventListener('DOMContentLoaded', initPublic);
</script>
</body>
</html>
