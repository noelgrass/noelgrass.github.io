<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Under Maintenance | Noel Grass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --gold: #C5A880;
    --gold-soft: #B9975C;
    --gold-dim: #7a6b4f;
    --gold-pale: #E8D5B5;
    --offwhite: #EDEAE3;
    --muted: #9a958c;
    --rule: #2a2a2a;
    --scrollbar-width: 0px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  html.menu-lock { overflow: hidden; padding-right: var(--scrollbar-width, 0px); }
  html, body { color: var(--offwhite); scroll-behavior: smooth; }
  body { background: var(--bg); font-family: 'Playfair Display', Georgia, serif; font-size: 17px; line-height: 1.75; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body.menu-open .page-wrap { filter: blur(8px) brightness(0.4); opacity: 0.6; pointer-events: none; user-select: none; will-change: filter, opacity; }

  a { color: var(--gold); text-decoration: none; transition: color 0.25s ease; }
  a:hover { color: #FCFCF7; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes menuFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes menuLineDraw { from { transform: scaleX(0); transform-origin: left center; } to { transform: scaleX(1); transform-origin: left center; } }
  @keyframes menuLinkIn { from { opacity: 0; transform: translate3d(-12px, 0, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
  @keyframes menuHeadingIn { from { opacity: 0; letter-spacing: 0.5em; } to { opacity: 1; letter-spacing: 0.35em; } }
  @keyframes glowPulse { 0%, 100% { opacity: 0.1; transform: scale(0.98); } 50% { opacity: 0.3; transform: scale(1.02); } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }

  .topnav { position: sticky; top: 0; z-index: 300; background: var(--bg); padding: 22px 40px; display: flex; align-items: center; justify-content: space-between; animation: fadeUp 0.8s ease-out both; contain: layout paint; }
  .wordmark { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 1.15em; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold); transition: color 0.3s ease, text-shadow 0.5s ease; position: relative; padding-bottom: 2px; }
  .wordmark:hover { color: #FCFCF7; text-shadow: 0 0 18px rgba(197,168,128,0.55), 0 0 40px rgba(197,168,128,0.25); }
  .menu-toggle { background: transparent; border: 0; cursor: pointer; padding: 8px 4px; display: inline-flex; align-items: center; gap: 12px; font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 0.75em; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-pale); transition: color 0.3s ease; -webkit-tap-highlight-color: transparent; position: relative; }
  .menu-toggle:hover { color: #FBFAFC; }
  .hamburger { display: inline-flex; flex-direction: column; justify-content: space-between; width: 22px; height: 14px; position: relative; }
  .hamburger span { display: block; width: 100%; height: 1.5px; background: currentColor; border-radius: 2px; transform-origin: center; transition: transform 0.45s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease, width 0.45s cubic-bezier(0.22,1,0.36,1); }
  .menu-toggle[aria-expanded="true"] .hamburger span:nth-child(1) { transform: translateY(6.25px) rotate(45deg); }
  .menu-toggle[aria-expanded="true"] .hamburger span:nth-child(2) { opacity: 0; width: 0; }
  .menu-toggle[aria-expanded="true"] .hamburger span:nth-child(3) { transform: translateY(-6.25px) rotate(-45deg); }
  .menu-toggle::after { content: ''; position: absolute; left: 34px; right: 4px; bottom: 2px; height: 1px; background: var(--gold); transform: scaleX(0); transform-origin: right center; transition: transform 0.4s ease; }
  .menu-toggle:hover::after { transform: scaleX(1); transform-origin: left center; }
  
  .page-wrap { transition: filter 0.6s cubic-bezier(0.16,1,0.3,1), opacity 0.6s cubic-bezier(0.16,1,0.3,1); min-height: 100vh; display: flex; align-items: center; justify-content: center; }

  .menu-panel { position: fixed; inset: 0; z-index: 400; background: #000000; background-image: radial-gradient(ellipse at 50% 50%, rgba(197,168,128,0.07) 0%, transparent 65%); opacity: 0; pointer-events: none; transform: scale(1.02); transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1); overflow-y: auto; overscroll-behavior: contain; }
  .menu-panel.open { opacity: 1; transform: scale(1); pointer-events: auto; }
  .menu-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 60px; max-width: 1200px; margin: 0 auto; padding: 120px 40px 80px; min-height: 100vh; position: relative; }
  .menu-top { position: absolute; top: 32px; left: 40px; right: 40px; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
  .menu-heading { font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 0.7em; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold-pale); display: inline-flex; align-items: center; gap: 20px; opacity: 0; }
  .menu-panel.open .menu-heading { animation: menuHeadingIn 0.8s cubic-bezier(0.16,1,0.3,1) 0.1s forwards; }
  .menu-heading::after { content: ''; display: inline-block; width: 60px; height: 1px; background: var(--gold); transform: scaleX(0); transform-origin: left center; }
  .menu-panel.open .menu-heading::after { animation: menuLineDraw 0.9s cubic-bezier(0.16,1,0.3,1) 0.4s forwards; }
  .menu-close { background: transparent; border: 0; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 1em; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-pale); padding: 12px 8px; display: inline-flex; align-items: center; gap: 16px; transition: color 0.4s ease, letter-spacing 0.5s ease, text-shadow 0.5s ease; opacity: 0; -webkit-tap-highlight-color: transparent; }
  .menu-panel.open .menu-close { animation: menuFadeIn 0.8s ease-out 1.2s forwards; }
  .menu-close:hover { color: #FCFCF7; letter-spacing: 0.45em; text-shadow: 0 0 20px rgba(197,168,128,0.7), 0 0 45px rgba(197,168,128,0.3); }
  .menu-close .x { display: inline-block; width: 18px; height: 18px; position: relative; transition: transform 0.4s ease; }
  .menu-close:hover .x { transform: rotate(90deg); }
  .menu-close .x::before, .menu-close .x::after { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: currentColor; transform-origin: center; }
  .menu-close .x::before { transform: rotate(45deg); }
  .menu-close .x::after { transform: rotate(-45deg); }
  .menu-columns { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; text-align: center; max-width: 900px; width: 100%; }
  .menu-column { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .menu-section { font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 0.68em; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 28px; display: block; opacity: 0; text-align: center; transition: opacity 0.5s ease; }
  .menu-panel.open .menu-column:nth-child(1) .menu-section { animation: menuLinkIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.5s forwards; }
  .menu-links { list-style: none; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; padding: 0; }
  .menu-item { position: relative; opacity: 0; }
  .menu-panel.open .menu-item:nth-child(1) { animation: menuLinkIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.6s forwards; }
  .menu-panel.open .menu-item:nth-child(2) { animation: menuLinkIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.72s forwards; }
  .menu-panel.open .menu-item:nth-child(3) { animation: menuLinkIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.84s forwards; }
  .menu-panel.open .menu-item:nth-child(4) { animation: menuLinkIn 0.7s cubic-bezier(0.16,1,0.3,1) 0.96s forwards; }
  .menu-panel.open .menu-item:nth-child(5) { animation: menuLinkIn 0.7s cubic-bezier(0.16,1,0.3,1) 1.08s forwards; }
  .menu-link { display: inline-block; position: relative; white-space: nowrap; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 1.5em; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold-pale); padding: 6px 0; transition: color 0.6s ease, opacity 0.5s ease, text-shadow 0.9s cubic-bezier(0.16,1,0.3,1); }
  .menu-link:hover { color: #FCFCF7; text-shadow: 0 0 10px rgba(197,168,128,0.75), 0 0 25px rgba(197,168,128,0.55), 0 0 55px rgba(197,168,128,0.30), 0 0 100px rgba(197,168,128,0.15); }
  .menu-link.current { color: var(--gold-dim); pointer-events: none; cursor: default; }
  .menu-columns:has(.menu-link:hover) .menu-link:not(:hover) { opacity: 0.25; }
  .menu-columns:has(.menu-link:hover) .menu-section { opacity: 0.15; }
  .menu-bottom { font-family: 'Montserrat', sans-serif; font-weight: 300; font-size: 0.62em; letter-spacing: 0.4em; text-transform: uppercase; color: var(--gold-dim); opacity: 0; margin-top: 20px; }
  .menu-panel.open .menu-bottom { animation: menuFadeIn 1s ease-out 1.6s forwards; }
  .menu-backdrop { position: absolute; inset: 0; z-index: -1; cursor: pointer; }

  /* ═══════════════════════════════════════════════════════════
     MAINTENANCE PAGE CENTERPIECE
     ═══════════════════════════════════════════════════════════ */
  .maintenance-center {
    text-align: center;
    max-width: 800px;
    padding: 40px 20px;
    position: relative;
    z-index: 10;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 0.2s;
  }

  .maintenance-center::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 400px; height: 400px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(197, 168, 128, 0.15) 0%, transparent 60%);
    z-index: -1;
    animation: glowPulse 6s ease-in-out infinite;
    pointer-events: none;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400;
    color: var(--gold);
    font-size: 3.5em;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin: 0 0 20px;
    line-height: 1.1;
    text-shadow: 0 0 20px rgba(197, 168, 128, 0.3);
  }

  .divider {
    width: 60px;
    height: 1px;
    background: var(--gold-soft);
    margin: 0 auto 30px;
    opacity: 0.7;
  }

  .maintenance-message {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 1.25em;
    line-height: 1.8;
    color: var(--offwhite);
    margin-bottom: 40px;
    opacity: 0.9;
  }

  .return-btn {
    display: inline-block;
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 0.8em;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold-pale);
    background: transparent;
    border: 1px solid var(--gold-soft);
    padding: 16px 40px;
    transition: all 0.4s ease;
    cursor: pointer;
  }

  .return-btn:hover {
    background: rgba(197, 168, 128, 0.1);
    color: #FCFCF7;
    border-color: var(--gold);
    box-shadow: 0 0 25px rgba(197, 168, 128, 0.3);
  }

  @media (max-width: 700px) {
    .topnav { padding: 18px 22px; }
    .wordmark { font-size: 0.95em; letter-spacing: 0.28em; }
    .menu-toggle { font-size: 0.7em; letter-spacing: 0.22em; gap: 10px; }
    .hamburger { width: 20px; height: 13px; }
    .menu-inner { padding: 90px 24px 60px; gap: 40px; }
    .menu-top { top: 22px; left: 24px; right: 24px; }
    .menu-close { font-size: 0.85em; letter-spacing: 0.35em; gap: 12px; }
    .menu-close .x { width: 15px; height: 15px; }
    .menu-columns { grid-template-columns: 1fr; gap: 40px; max-width: 100%; }
    .menu-column .menu-link { font-size: 1.3em; letter-spacing: 0.22em; }
    .menu-section { margin-bottom: 20px; }
    .menu-links { gap: 16px; }
    .menu-bottom { margin-top: 10px; }
    
    h1 { font-size: 2.2em; }
    .maintenance-message { font-size: 1.1em; }
    .return-btn { padding: 14px 30px; font-size: 0.7em; }
  }
</style>
</head>
<body>

<header class="topnav">
  <a href="../" class="wordmark" aria-label="Noel Grass — Home">Noel Grass</a>
  <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="menuPanel" type="button">
    <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
    <span>Menu</span>
  </button>
</header>

<!-- 🚨 EXACT MENU COPY FROM INDEX.HTML 🚨 -->
<nav class="menu-panel" id="menuPanel" aria-label="Primary" aria-hidden="true">
  <div class="menu-backdrop" id="menuBackdrop"></div>
  <div class="menu-inner">
    <div class="menu-top">
      <span class="menu-heading">Menu</span>
      <button class="menu-close" id="menuClose" type="button" aria-label="Close menu">
        Close <span class="x" aria-hidden="true"></span>
      </button>
    </div>
    <div class="menu-columns">
      <div class="menu-column">
        <span class="menu-section">Explore</span>
        <ul class="menu-links">
          <li class="menu-item"><a href="../biography" class="menu-link">Biography</a></li>
          <li class="menu-item"><a href="../" class="menu-link">Home</a></li>
          <li class="menu-item"><a href="../artist" class="menu-link">Artist</a></li>
          <li class="menu-item"><a href="../film-composer" class="menu-link">Film Composer</a></li>
          <li class="menu-item"><a href="../contact" class="menu-link">Contact</a></li>
        </ul>
      </div>
    </div>
    <div class="menu-bottom">Noel Grass · <span id="year"></span></div>
  </div>
</nav>

<div class="page-wrap" id="pageWrap">
  <div class="maintenance-center">
    <h1>Under Maintenance</h1>
    <div class="divider"></div>
    <p class="maintenance-message">We are currently refining the system and updating a few details to ensure the best possible experience. We will be back shortly.</p>
    
    <!-- Optional: Add a button that redirects you back home, or delete it for pure minimalism -->
    <a href="../" class="return-btn">Return to Home</a>
  </div>
</div>

<script>
  (function () {
    var toggle   = document.getElementById('menuToggle');
    var panel    = document.getElementById('menuPanel');
    var closeBtn = document.getElementById('menuClose');
    var backdrop = document.getElementById('menuBackdrop');

    function getScrollbarWidth() { return window.innerWidth - document.documentElement.clientWidth; }
    function lockScroll() { var sw = getScrollbarWidth(); document.documentElement.style.setProperty('--scrollbar-width', sw + 'px'); document.documentElement.classList.add('menu-lock'); }
    function unlockScroll() { document.documentElement.classList.remove('menu-lock'); document.documentElement.style.removeProperty('--scrollbar-width'); }
    function openMenu() { panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); document.body.classList.add('menu-open'); lockScroll(); toggle.setAttribute('aria-expanded', 'true'); toggle.setAttribute('aria-label', 'Close menu'); }
    function closeMenu() { panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); document.body.classList.remove('menu-open'); unlockScroll(); toggle.setAttribute('aria-expanded', 'false'); toggle.setAttribute('aria-label', 'Open menu'); }

    toggle.addEventListener('click', function (e) { e.stopPropagation(); if (panel.classList.contains('open')) { closeMenu(); } else { openMenu(); } });
    closeBtn.addEventListener('click', closeMenu);
    backdrop.addEventListener('click', closeMenu);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && panel.classList.contains('open')) { closeMenu(); } });
    panel.querySelectorAll('a').forEach(function (link) { link.addEventListener('click', closeMenu); });

    var yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
  })();
</script>
</body>
</html>
