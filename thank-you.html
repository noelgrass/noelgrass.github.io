<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #000000;
    --gold: #C5A880;
    --gold-soft: #B9975C;
    --gold-pale: #E8D5B5;
    --gold-dim: #7a6b4f;
    --offwhite: #EDEAE3;
    --muted: #9a958c;
    --rule: #2a2a2a;
    --scrollbar-width: 0px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background: var(--bg);
  }

  html.menu-lock {
    overflow: hidden;
    padding-right: var(--scrollbar-width, 0px);
  }

  html, body {
    color: var(--offwhite);
    scroll-behavior: smooth;
    min-height: 100vh;
  }

  body {
    background: var(--bg);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 17px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  a {
    color: var(--gold);
    text-decoration: none;
    transition: color 0.25s ease;
  }

  a:hover { color: #FCFCF7; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes menuFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes menuLineDraw {
    from { transform: scaleX(0); transform-origin: left center; }
    to   { transform: scaleX(1); transform-origin: left center; }
  }

  @keyframes menuLinkIn {
    from {
      opacity: 0;
      transform: translate3d(-12px, 0, 0);
    }
    to {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }
  }

  @keyframes menuHeadingIn {
    from {
      opacity: 0;
      letter-spacing: 0.5em;
    }
    to {
      opacity: 1;
      letter-spacing: 0.35em;
    }
  }

  /* Slow breathing glow — same cadence as the homepage name */
  @keyframes softGlow {
    0% {
      text-shadow:
        0 0 25px rgba(197, 168, 128, 0.25),
        0 0 55px rgba(197, 168, 128, 0.12);
    }
    50% {
      text-shadow:
        0 0 35px rgba(197, 168, 128, 0.55),
        0 0 80px rgba(197, 168, 128, 0.28);
    }
    100% {
      text-shadow:
        0 0 25px rgba(197, 168, 128, 0.25),
        0 0 55px rgba(197, 168, 128, 0.12);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ============================================================
     TOP BAR — wordmark + hamburger (shared across pages)
     ============================================================ */
  .topnav {
    position: sticky;
    top: 0;
    z-index: 300;
    background: var(--bg);
    padding: 22px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    animation: fadeUp 0.8s ease-out both;
    contain: layout paint;
  }

  .wordmark {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 1.15em;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    transition: color 0.3s ease, text-shadow 0.5s ease;
    position: relative;
    padding-bottom: 2px;
  }

  .wordmark:hover {
    color: #FCFCF7;
    text-shadow:
      0 0 18px rgba(197, 168, 128, 0.55),
      0 0 40px rgba(197, 168, 128, 0.25);
  }

  .menu-toggle {
    background: transparent;
    border: 0;
    cursor: pointer;
    padding: 8px 4px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 0.75em;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-pale);
    transition: color 0.3s ease;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }

  .menu-toggle:hover { color: #FBFAFC; }

  .hamburger {
    display: inline-flex;
    flex-direction: column;
    justify-content: space-between;
    width: 22px;
    height: 14px;
    position: relative;
  }

  .hamburger span {
    display: block;
    width: 100%;
    height: 1.5px;
    background: currentColor;
    border-radius: 2px;
    transform-origin: center;
    transition:
      transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.3s ease,
      width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .menu-toggle[aria-expanded="true"] .hamburger span:nth-child(1) {
    transform: translateY(6.25px) rotate(45deg);
  }
  .menu-toggle[aria-expanded="true"] .hamburger span:nth-child(2) {
    opacity: 0;
    width: 0;
  }
  .menu-toggle[aria-expanded="true"] .hamburger span:nth-child(3) {
    transform: translateY(-6.25px) rotate(-45deg);
  }

  .menu-toggle::after {
    content: '';
    position: absolute;
    left: 34px;
    right: 4px;
    bottom: 2px;
    height: 1px;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: right center;
    transition: transform 0.4s ease;
  }

  .menu-toggle:hover::after {
    transform: scaleX(1);
    transform-origin: left center;
  }

  .page-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    transition: filter 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  body.menu-open .page-wrap {
    filter: blur(8px) brightness(0.4);
    opacity: 0.6;
    pointer-events: none;
    user-select: none;
    will-change: filter, opacity;
  }

  /* ============================================================
     CINEMATIC FULL-SCREEN OVERLAY MENU (single-column, Home-style)
     ============================================================ */
  .menu-panel {
    position: fixed;
    inset: 0;
    z-index: 400;
    background: #000000;
    background-image: radial-gradient(
      ellipse at 50% 50%,
      rgba(197, 168, 128, 0.07) 0%,
      transparent 65%
    );
    opacity: 0;
    pointer-events: none;
    transform: scale(1.02);
    transition:
      opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .menu-panel.open {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  .menu-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 120px 40px 80px;
    min-height: 100vh;
    position: relative;
  }

  .menu-top {
    position: absolute;
    top: 32px;
    left: 40px;
    right: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 2;
  }

  .menu-heading {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 0.7em;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold-pale);
    display: inline-flex;
    align-items: center;
    gap: 20px;
    opacity: 0;
  }

  .menu-panel.open .menu-heading {
    animation: menuHeadingIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
  }

  .menu-heading::after {
    content: '';
    display: inline-block;
    width: 60px;
    height: 1px;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left center;
  }

  .menu-panel.open .menu-heading::after {
    animation: menuLineDraw 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  }

  .menu-close {
    background: transparent;
    border: 0;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 1em;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold-pale);
    padding: 12px 8px;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    transition: color 0.4s ease, letter-spacing 0.5s ease, text-shadow 0.5s ease;
    opacity: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .menu-panel.open .menu-close {
    animation: menuFadeIn 0.8s ease-out 1.2s forwards;
  }

  .menu-close:hover {
    color: #FCFCF7;
    letter-spacing: 0.45em;
    text-shadow:
      0 0 20px rgba(197, 168, 128, 0.7),
      0 0 45px rgba(197, 168, 128, 0.3);
  }

  .menu-close .x {
    display: inline-block;
    width: 18px;
    height: 18px;
    position: relative;
    transition: transform 0.4s ease;
  }

  .menu-close:hover .x {
    transform: rotate(90deg);
  }

  .menu-close .x::before,
  .menu-close .x::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: currentColor;
    transform-origin: center;
  }

  .menu-close .x::before { transform: rotate(45deg); }
  .menu-close .x::after  { transform: rotate(-45deg); }

  .menu-links {
    list-style: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    text-align: center;
    padding-top: 20px;
    margin: 0;
    padding-left: 0;
    padding-right: 0;
    padding-bottom: 0;
  }

  .menu-section {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 0.68em;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 20px;
    display: block;
    opacity: 0;
    text-align: center;
    transition: opacity 0.5s ease;
  }

  .menu-panel.open .menu-section {
    animation: menuLinkIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  }

  .menu-item {
    position: relative;
    opacity: 0;
  }

  .menu-panel.open .menu-item:nth-child(2) { animation: menuLinkIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }
  .menu-panel.open .menu-item:nth-child(3) { animation: menuLinkIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.72s forwards; }
  .menu-panel.open .menu-item:nth-child(4) { animation: menuLinkIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.84s forwards; }
  .menu-panel.open .menu-item:nth-child(5) { animation: menuLinkIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.96s forwards; }
  .menu-panel.open .menu-item:nth-child(6) { animation: menuLinkIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.08s forwards; }
  .menu-panel.open .menu-item:nth-child(7) { animation: menuLinkIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1.20s forwards; }

  .menu-link {
    display: inline-block;
    position: relative;
    white-space: nowrap;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 2em;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold-pale);
    padding: 8px 0 8px 0;
    transition:
      color 0.6s ease,
      opacity 0.5s ease,
      text-shadow 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .menu-link:hover {
    color: #FCFCF7;
    text-shadow:
      0 0 12px rgba(197, 168, 128, 0.75),
      0 0 30px rgba(197, 168, 128, 0.55),
      0 0 70px rgba(197, 168, 128, 0.30),
      0 0 130px rgba(197, 168, 128, 0.15);
  }

  .menu-link.current {
    color: var(--gold-dim);
    pointer-events: none;
    cursor: default;
  }

  .menu-links:has(.menu-link:hover) .menu-link:not(:hover) {
    opacity: 0.25;
  }

  .menu-links:has(.menu-link:hover) .menu-section {
    opacity: 0.15;
  }

  .menu-bottom {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 0.62em;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold-dim);
    opacity: 0;
    margin-top: 20px;
  }

  .menu-panel.open .menu-bottom {
    animation: menuFadeIn 1s ease-out 1.6s forwards;
  }

  .menu-backdrop {
    position: absolute;
    inset: 0;
    z-index: -1;
    cursor: pointer;
  }

  /* ============================================================
     PAGE
     ============================================================ */
  .page {
    flex: 1;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    padding: 140px 40px 100px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .ornament {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
    opacity: 0.9;
    margin-bottom: 50px;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 0.2s;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400;
    color: var(--gold);
    font-size: 3.2em;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 40px;
    animation:
      fadeUp 1.2s ease-out both,
      softGlow 6s ease-in-out infinite;
    animation-delay: 0.3s, 1.5s;
  }

  .lead {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 1.25em;
    color: var(--gold-pale);
    line-height: 1.7;
    max-width: 580px;
    margin: 0 auto 30px;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 0.6s;
  }

  .body-text {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.05em;
    color: var(--offwhite);
    line-height: 1.85;
    max-width: 580px;
    margin: 0 auto 60px;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 0.8s;
  }

  .rule {
    width: 48px;
    height: 1px;
    background: var(--gold-soft);
    opacity: 0.6;
    margin: 0 auto 60px;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 1s;
  }

  .nav-options {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 1.2s;
  }

  .nav-options a {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 1.05em;
    color: var(--gold-pale);
    padding-bottom: 2px;
    border-bottom: 1px solid rgba(197, 168, 128, 0.5);
    transition: transform 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }

  .nav-options a:hover {
    transform: translateX(4px);
    border-bottom-color: var(--gold);
    color: #FCFCF7;
  }

  .nav-options .diamond {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
    opacity: 0.7;
  }

  /* ---------- SIGNATURE ---------- */
  .signature {
    margin-top: 110px;
    text-align: center;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 1.5s;
  }

  .signature-logo {
    display: inline-block;
    height: 70px;
    width: auto;
    opacity: 0.95;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 700px) {
    .page { padding: 80px 22px 70px; }
    .ornament { margin-bottom: 36px; }
    h1 { font-size: 2.2em; letter-spacing: 0.15em; margin-bottom: 30px; }
    .lead { font-size: 1.1em; margin-bottom: 24px; }
    .body-text { font-size: 1em; margin-bottom: 45px; }
    .rule { margin-bottom: 45px; }
    .nav-options { gap: 20px; }
    .nav-options a { font-size: 0.95em; }

    .topnav { padding: 18px 22px; }

    .wordmark {
      font-size: 0.95em;
      letter-spacing: 0.28em;
    }

    .menu-toggle {
      font-size: 0.7em;
      letter-spacing: 0.22em;
      gap: 10px;
    }

    .hamburger {
      width: 20px;
      height: 13px;
    }

    .menu-toggle[aria-expanded="true"] .hamburger span:nth-child(1) {
      transform: translateY(5.75px) rotate(45deg);
    }
    .menu-toggle[aria-expanded="true"] .hamburger span:nth-child(3) {
      transform: translateY(-5.75px) rotate(-45deg);
    }

    .menu-inner {
      padding: 90px 24px 60px;
      gap: 32px;
    }

    .menu-top {
      top: 22px;
      left: 24px;
      right: 24px;
    }

    .menu-close {
      font-size: 0.85em;
      letter-spacing: 0.35em;
      gap: 12px;
    }

    .menu-close .x {
      width: 15px;
      height: 15px;
    }

    .menu-links {
      gap: 24px;
      padding-top: 10px;
    }

    .menu-link {
      font-size: 1.5em;
      letter-spacing: 0.22em;
    }

    .menu-bottom {
      margin-top: 10px;
    }

    .signature { margin-top: 80px; }
    .signature-logo { height: 55px; }
  }

  @media (max-width: 380px) {
    .wordmark {
      font-size: 0.8em;
      letter-spacing: 0.22em;
    }
    .menu-toggle {
      font-size: 0.65em;
      letter-spacing: 0.18em;
    }
    .menu-toggle::after {
      left: 30px;
    }

    .menu-link {
      font-size: 1.2em;
      letter-spacing: 0.18em;
    }
  }
</style>
</head>
<body>

<!-- ===== STICKY TOP BAR ===== -->
<header class="topnav">
  <a href="./" class="wordmark" aria-label="Noel Grass — Home">Noel Grass</a>

  <button
    class="menu-toggle"
    id="menuToggle"
    aria-label="Open menu"
    aria-expanded="false"
    aria-controls="menuPanel"
    type="button"
  >
    <span class="hamburger" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </span>
    <span>Menu</span>
  </button>
</header>

<!-- ===== FULL-SCREEN OVERLAY MENU (Home-style) ===== -->
<nav
  class="menu-panel"
  id="menuPanel"
  aria-label="Primary"
  aria-hidden="true"
>
  <div class="menu-backdrop" id="menuBackdrop"></div>

  <div class="menu-inner">

    <div class="menu-top">
      <span class="menu-heading">Menu</span>
      <button class="menu-close" id="menuClose" type="button" aria-label="Close menu">
        Close
        <span class="x" aria-hidden="true"></span>
      </button>
    </div>

    <ul class="menu-links">
      <span class="menu-section">Explore</span>
      <li class="menu-item"><a href="biography" class="menu-link">Biography</a></li>
      <li class="menu-item"><a href="./" class="menu-link">Home</a></li>
      <li class="menu-item"><a href="artist" class="menu-link">Artist</a></li>
      <li class="menu-item"><a href="film-composer" class="menu-link">Film Composer</a></li>
      <li class="menu-item"><a href="contact" class="menu-link">Contact</a></li>
    </ul>

    <div class="menu-bottom">Noel Grass · <span id="year"></span></div>

  </div>
</nav>

<!-- ===== PAGE ===== -->
<div class="page-wrap" id="pageWrap">

  <div class="page">

    <span class="ornament" aria-hidden="true"></span>

    <h1>Thank You</h1>

    <p class="lead">Your message has been received.</p>

    <p class="body-text">I read every inquiry personally and will reply within 24 to 48 hours. In the meantime, feel free to explore the work.</p>

    <div class="rule"></div>

    <div class="nav-options">
      <a href="discography">Discography</a>
      <span class="diamond" aria-hidden="true"></span>
      <a href="film-gallery">Film Gallery</a>
      <span class="diamond" aria-hidden="true"></span>
      <a href="./">Home</a>
    </div>

    <div class="signature">
      <img src="images/noel-grass-logo.png" alt="Noel Grass" class="signature-logo">
    </div>

  </div>

</div>

<script>
  (function () {
    var toggle   = document.getElementById('menuToggle');
    var panel    = document.getElementById('menuPanel');
    var closeBtn = document.getElementById('menuClose');
    var backdrop = document.getElementById('menuBackdrop');

    function getScrollbarWidth() {
      return window.innerWidth - document.documentElement.clientWidth;
    }

    function lockScroll() {
      var sw = getScrollbarWidth();
      document.documentElement.style.setProperty('--scrollbar-width', sw + 'px');
      document.documentElement.classList.add('menu-lock');
    }

    function unlockScroll() {
      document.documentElement.classList.remove('menu-lock');
      document.documentElement.style.removeProperty('--scrollbar-width');
    }

    function openMenu() {
      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
      document.body.classList.add('menu-open');
      lockScroll();
      toggle.setAttribute('aria-expanded', 'true');
      toggle.setAttribute('aria-label', 'Close menu');
    }

    function closeMenu() {
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('menu-open');
      unlockScroll();
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Open menu');
    }

    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      if (panel.classList.contains('open')) {
        closeMenu();
      } else {
        openMenu();
      }
    });

    closeBtn.addEventListener('click', closeMenu);
    backdrop.addEventListener('click', closeMenu);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && panel.classList.contains('open')) {
        closeMenu();
      }
    });

    panel.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', closeMenu);
    });

    function normalizePath(path) {
      path = path.split('?')[0].split('#')[0];
      path = path.replace(/\.html?$/i, '');
      if (path.length > 1 && path.endsWith('/')) {
        path = path.slice(0, -1);
      }
      path = path.replace(/\/index$/i, '/');
      if (!path.startsWith('/')) path = '/' + path;
      return path;
    }

    var current = normalizePath(window.location.pathname);
    var links = panel.querySelectorAll('a.menu-link');
    var matched = null;

    links.forEach(function (link) {
      var href = link.getAttribute('href');
      if (!href) return;
      if (/^(https?:|mailto:|tel:|#)/i.test(href)) return;

      var linkPath = normalizePath(href);
      if (linkPath === current) {
        matched = link;
      }
    });

    if (!matched && (current === '/' || current === '')) {
      links.forEach(function (link) {
        var href = link.getAttribute('href');
        if (href === './' || href === '/' || href === 'index.html') {
          matched = link;
        }
      });
    }

    if (matched) {
      matched.classList.add('current');
      matched.setAttribute('aria-current', 'page');
    }

    var yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
  })();
</script>

</body>
</html>
