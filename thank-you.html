<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="JuTCKvWQJUv0mCfM69TcrIja7bt--m6m6s7ME3gVoqg" />

<title>Thank You — Noel Grass</title>
<meta name="description" content="Thank you for your message. Noel Grass will reply within 24 to 48 hours.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://noelgrass.github.io/thank-you">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #000000;
    --gold: #C5A880;
    --gold-soft: #B9975C;
    --gold-pale: #E8D5B5;
    --offwhite: #EDEAE3;
    --muted: #9a958c;
    --rule: #2a2a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--offwhite);
    min-height: 100vh;
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 17px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  a {
    color: var(--gold);
    text-decoration: none;
    transition: color 0.25s ease;
  }

  a:hover { color: #FCFCF7; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Slow breathing glow — same cadence as the homepage name */
  @keyframes softGlow {
    0% {
      text-shadow:
        0 0 25px rgba(197, 168, 128, 0.25),
        0 0 55px rgba(197, 168, 128, 0.12);
    }
    50% {
      text-shadow:
        0 0 35px rgba(197, 168, 128, 0.55),
        0 0 80px rgba(197, 168, 128, 0.28);
    }
    100% {
      text-shadow:
        0 0 25px rgba(197, 168, 128, 0.25),
        0 0 55px rgba(197, 168, 128, 0.12);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ---------- TOP NAV ---------- */
  .topnav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(8px);
    padding: 28px 20px;
    text-align: center;
    border-bottom: 1px solid var(--rule);
    animation: fadeUp 0.8s ease-out both;
  }

  .topnav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px 34px;
  }

  .topnav a {
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 0.8em;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-pale);
    text-decoration: none;
    position: relative;
    transition: color 0.3s ease;
  }

  .topnav a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0;
    height: 1px;
    background: var(--gold);
    transition: width 0.35s ease;
    pointer-events: none;
  }

  .topnav a:hover { color: #FBFAFC; }
  .topnav a:hover::after { width: 100%; }

  .topnav li { position: relative; }

  .topnav li + li::before {
    content: '';
    position: absolute;
    left: -18px;
    top: 50%;
    transform: translateY(-50%);
    width: 1px;
    height: 14px;
    background: var(--gold-soft);
    opacity: 0.6;
  }

  /* ---------- PAGE ---------- */
  .page {
    flex: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 140px 40px 100px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .ornament {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
    opacity: 0.9;
    margin-bottom: 50px;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 0.2s;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 400;
    color: var(--gold);
    font-size: 3.2em;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 40px;
    animation:
      fadeUp 1.2s ease-out both,
      softGlow 6s ease-in-out infinite;
    animation-delay: 0.3s, 1.5s;
  }

  .lead {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 1.25em;
    color: var(--gold-pale);
    line-height: 1.7;
    max-width: 580px;
    margin: 0 auto 30px;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 0.6s;
  }

  .body-text {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.05em;
    color: var(--offwhite);
    line-height: 1.85;
    max-width: 580px;
    margin: 0 auto 60px;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 0.8s;
  }

  .rule {
    width: 48px;
    height: 1px;
    background: var(--gold-soft);
    opacity: 0.6;
    margin: 0 auto 60px;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 1s;
  }

  .nav-options {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 1.2s;
  }

  .nav-options a {
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-size: 1.05em;
    color: var(--gold-pale);
    padding-bottom: 2px;
    border-bottom: 1px solid rgba(197, 168, 128, 0.5);
    transition: transform 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }

  .nav-options a:hover {
    transform: translateX(4px);
    border-bottom-color: var(--gold);
    color: #FCFCF7;
  }

  .nav-options .diamond {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
    opacity: 0.7;
  }

  /* ---------- SIGNATURE ---------- */
  .signature {
    margin-top: 110px;
    text-align: center;
    animation: fadeUp 1.2s ease-out both;
    animation-delay: 1.5s;
  }

  .signature-logo {
    display: inline-block;
    height: 70px;
    width: auto;
    opacity: 0.95;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 700px) {
    .page { padding: 80px 22px 70px; }
    .ornament { margin-bottom: 36px; }
    h1 { font-size: 2.2em; letter-spacing: 0.15em; margin-bottom: 30px; }
    .lead { font-size: 1.1em; margin-bottom: 24px; }
    .body-text { font-size: 1em; margin-bottom: 45px; }
    .rule { margin-bottom: 45px; }
    .nav-options { gap: 20px; }
    .nav-options a { font-size: 0.95em; }
    .topnav { padding: 20px 14px; }
    .topnav a { font-size: 0.7em; letter-spacing: 0.15em; }
    .topnav ul { gap: 10px 22px; }
    .topnav li + li::before { left: -12px; height: 10px; }
    .signature { margin-top: 80px; }
    .signature-logo { height: 55px; }
  }
</style>
</head>
<body>

<nav class="topnav">
  <ul>
    <li><a href="biography">Biography</a></li>
    <li><a href="./">Home</a></li>
    <li><a href="film-composer">About</a></li>
    <li><a href="commission">Commission a Scene</a></li>
    <li><a href="film-gallery">Gallery</a></li>
    <li><a href="rent">Rent</a></li>
    <li><a href="contact">Contact</a></li>
  </ul>
</nav>

<div class="page">

  <span class="ornament" aria-hidden="true"></span>

  <h1>Thank You</h1>

  <p class="lead">Your message has been received.</p>

  <p class="body-text">I read every inquiry personally and will reply within 24 to 48 hours. In the meantime, feel free to explore the work.</p>

  <div class="rule"></div>

  <div class="nav-options">
    <a href="discography">Discography</a>
    <span class="diamond" aria-hidden="true"></span>
    <a href="film-gallery">Film Gallery</a>
    <span class="diamond" aria-hidden="true"></span>
    <a href="./">Home</a>
  </div>

  <div class="signature">
    <img src="images/noel-grass-logo.png" alt="Noel Grass" class="signature-logo">
  </div>

</div>

</body>
</html>
