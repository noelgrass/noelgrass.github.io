  .topnav a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0;
    height: 1px;
    background: var(--gold);
    transition: width 0.35s ease;
    pointer-events: none;
  }

  .topnav a:hover { color: #FBFAFC; }
  .topnav a:hover::after { width: 100%; }

  .topnav li { position: relative; }

  .topnav li + li::before {
    content: '';
